[package]
name = "hlwindow"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "xwindow's window adapter for HashLink and Ash, loaded as xwindow.hdll"
publish = false

[lib]
# cdylib is the hdll a VM loads as xwindow.hdll; staticlib is what the wasm
# side module is linked from.
crate-type = ["cdylib", "staticlib", "rlib"]

# winit on Android needs the activity the host's Java side starts; they
# cannot both be on. A host with a GameActivity turns the default off.
[features]
default = ["android-native-activity"]
android-native-activity = ["winit/android-native-activity"]
android-game-activity = ["winit/android-game-activity"]
# Defines android_main for an app that links the library from C, which
# provides xwindow_main; a Rust host defines its own and leaves this off.
android-main = []

[build-dependencies]
xwindow-backend = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "ff6bfc529ba16172b89019e2a4e2abda3039640e" }
xwindow-bindgen = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "ff6bfc529ba16172b89019e2a4e2abda3039640e" }

[dependencies]
hl_abi = { git = "https://github.com/rayzor-blade/hl_abi" }
# The HashLink carriers x-idl adapters share, kept in hlwgpu.
hl_xidl = { git = "https://github.com/rayzor-blade/hlwgpu.git", rev = "9fbcffd920f45d4c1683667a39340d25dbce266c" }
# The generated model names Ash's Future carrier by this crate's path.
ash_future_abi = { git = "https://github.com/rayzor-blade/ash.git", rev = "ac80cdb17c9fe82a0e86ab893e9d7304d5319fe6" }
xwindow-core = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "ff6bfc529ba16172b89019e2a4e2abda3039640e" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
winit = "0.30"
raw-window-handle = "0.6"

# A released hdll is loaded by a VM and never debugged through, so the symbol
# table is dead weight.
[profile.release]
lto = true
codegen-units = 1
strip = true
