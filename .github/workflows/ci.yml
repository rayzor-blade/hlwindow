name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # winit reaches X11 and Wayland through these.
      - name: Install the windowing headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # `build.rs` writes the Haxe API into the tree. A diff means the xwindow
      # pin and the committed package have drifted.
      - name: The generated files are the ones committed
        run: |
          cargo build
          git diff --exit-code || {
            echo "::error::a build changed committed files; commit what build.rs wrote"
            exit 1
          }

  size:
    name: size (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: size-${{ matrix.os }}

      - name: Install the windowing headers
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev

      - name: Install cargo-bloat
        run: cargo install cargo-bloat --locked

      # The released library's size and its largest crates, in the run's
      # summary.
      - name: Size report
        run: |
          scripts/size_report.sh 25 | tee size.txt
          {
            echo "### ${{ matrix.os }}"
            echo '```'
            cat size.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
